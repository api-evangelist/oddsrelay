  headers:
    X-Tokens-Limit:
      description: The account's tokens for the period, or `unlimited`. Sent when the balance is known.
      schema:
        type: string
        pattern: ^([0-9]+|unlimited)$
      example: unlimited
    X-Region:
      description: '`format=bare` only, raw and paged discovery: `meta.region`.'
      schema:
        type: string
      example: uk
    X-RateLimit-Remaining:
      description: Requests left in that window.
      schema:
        type: string
        pattern: ^[0-9]+$
    X-Next-Cursor:
      description: '`format=bare` only, raw and paged discovery: the next page''s cursor, empty on the last page.'
      schema:
        type: string
    Vary:
      description: 'Keyed replies: `Authorization, Accept-Encoding, Origin`. Keyless `/v2/coverage`: `Authorization, X-Api-Key, Accept-Encoding`. `/v2/openapi.json`: `Accept-Encoding`. JSON errors on `/v2` routes: `Origin`.'
      schema:
        type: string
      example: Authorization, Accept-Encoding, Origin
    Access-Control-Allow-Origin:
      description: '`*` on every GET reply of a keyless route (`/v2/status`, keyless `/v2/coverage`, `/v2/openapi.json`), refusals and errors included. A keyed reply never sends `*`: a browser or dashboard key''s reply echoes the exact request `Origin` when the key allows it, with `Access-Control-Expose-Headers`.'
      schema:
        type: string
      example: '*'
    X-RateLimit-Limit:
      description: The account's flood cap for the window with fewer requests left (per 10 seconds or per minute; your numbers are in `/v2/usage` `flood_cap`). On every reply to a valid key after authentication, 429 `too_many_requests` included; never on a 401, the per-address 429 or a keyless route.
      schema:
        type: string
        pattern: ^[0-9]+$
    X-Tokens-Used:
      description: Tokens the account has used this period. Sent with the other balance headers whenever the balance is known (while the key registry is unreachable a reply can carry `X-Tokens-Cost` alone).
      schema:
        type: string
        pattern: ^[0-9]+$
    X-Feed-Type:
      description: '`format=bare` only, raw and paged discovery: `meta.feed_type`.'
      schema:
        type: string
      example: raw
    X-Tokens-Reset:
      description: When the pool resets (ISO-8601 UTC, whole seconds); on a trial, the trial's end when that comes first. Sent when the balance is known.
      schema:
        type: string
      example: '2026-10-01T00:00:00Z'
    X-RateLimit-Reset:
      description: Seconds until that window ends.
      schema:
        type: string
        pattern: ^[0-9]+$
    X-Tokens-Remaining:
      description: Tokens left this period, or `unlimited` on an unlimited account. Sent when the balance is known.
      schema:
        type: string
        pattern: ^([0-9]+|unlimited)$
      example: unlimited
    Content-Encoding:
      description: '`gzip` when the body is gzip (see the gzip rules in the description).'
      schema:
        type: string
        enum:
        - gzip
      example: gzip
    X-Count:
      description: '`format=bare` only: the events served (matched boards), or the rows across all pages (raw, `/v2/sports`, `/v2/events`, `/v2/bookmakers`).'
      schema:
        type: string
        pattern: ^[0-9]+$
      example: '477'
    X-Tokens-Cost:
      description: 'Tokens this reply cost: 0 on a free reply (304, an empty reply, discovery, `/v2/usage`, `/v2/pricing`, a quote and every refusal). On every reply to a valid key, refusals included; never on a 401, on the per-address 429 or on a keyless route.'
      schema:
        type: string
        pattern: ^[0-9]+$
  parameters:
    commenceTimeTo:
      name: commenceTimeTo
      in: query
      description: Events kicking off at or before this ISO-8601 instant (no offset = UTC).
      required: false
      schema:
        type: string
      example: '2026-09-17T23:59:59Z'
    eventsSport:
      name: sport
      in: query
      description: 'Required: a sport key or a prefix of one as `/v2/sports` lists them. Missing is 400 `missing_param`; unknown 400 `unknown_sport` with `valid`.'
      required: true
      schema:
        type: string
      example: tennis
    cursor:
      name: cursor
      in: query
      description: 'The previous page''s `meta.next_cursor` (or `X-Next-Cursor`). A cursor is bound to no account and expires 300 s after it was issued: 400 `cursor expired: start again from the first page`; any other shape 400 `cursor not recognised: start again from the first page`.'
      required: false
      schema:
        type: string
    eventsEventIds:
      name: eventIds
      in: query
      description: Comma-separated, at most 50 event ids.
      required: false
      schema:
        type: string
    region:
      name: region
      in: query
      description: 'ONE lowercase region code (`/v2/regions` lists yours). Missing means `uk`: on a data route only when your key covers `uk`, else 400 `region_required` naming a code your key has; on discovery and keyless routes always. A comma list, the parameter sent twice or an uppercase code is 400 `bad_request`; an unknown code, or one with no live bookmaker here, is 404 `unknown_region`.'
      required: false
      schema:
        type: string
      example: uk
    format:
      name: format
      in: query
      description: '`envelope` (default): `{meta, data}`. `bare`: the `data` array alone, `meta` moved to `X-*` headers.'
      required: false
      schema:
        type: string
        enum:
        - envelope
        - bare
        default: envelope
    commenceTimeFrom:
      name: commenceTimeFrom
      in: query
      description: Events kicking off at or after this ISO-8601 instant (no offset = UTC; a fraction of a second rounds up). Not ISO-8601 is 400; on the matched boards a From after To is 400.
      required: false
      schema:
        type: string
      example: '2026-09-17T12:00:00Z'
    dateFormat:
      name: dateFormat
      in: query
      description: '`iso` (default, ISO-8601 UTC) or `unix` (integer epoch seconds) for `commence_time`, `processed_at` and `last_update`. `standard` and `dutching` serve iso only: anything else is 400.'
      required: false
      schema:
        type: string
        enum:
        - iso
        - unix
        default: iso
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer or_live_…`'
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: The same key in `x-api-key`.
