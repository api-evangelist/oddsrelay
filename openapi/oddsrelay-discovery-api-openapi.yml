openapi: 3.2.0
info:
  title: OddsRelay Discovery API
  version: '2026-07-08'
  x-verified: '2026-10-08'
  description: 'The OddsRelay odds API: matched boards, the raw board, discovery, coverage and status, as served at `https://api.oddsrelay.io`.'
servers:
- url: https://api.oddsrelay.io
security:
- bearerAuth: []
- apiKeyHeader: []
tags:
- name: Discovery
  description: Sports, events, venues, regions. Free.
paths:
  /v2/sports:
    get:
      operationId: listSports
      summary: Sports and competitions
      description: Every competition on the matched boards, grouped, with the market keys seen under each. Free. Paged 250 rows at a time in (group, key) order; a cursor expires 300 s after it was issued. `region` missing means `uk`; discovery is not scoped to your key's regions.
      tags:
      - Discovery
      parameters:
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/dateFormat'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: A page. Gzip unless refused (over 1 kB).
          headers:
            X-OddsRelay-Api-Version:
              description: 'Always sent: #/components/headers/X-OddsRelay-Api-Version'
              required: true
              schema:
                type: string
            Cache-Control:
              description: 'Always sent: #/components/headers/Cache-Control'
              required: true
              schema:
                type: string
            Vary:
              description: 'Always sent: #/components/headers/Vary'
              required: true
              schema:
                type: string
            X-RateLimit-Limit:
              description: 'Always sent: #/components/headers/X-RateLimit-Limit'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Remaining:
              description: 'Always sent: #/components/headers/X-RateLimit-Remaining'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Reset:
              description: 'Always sent: #/components/headers/X-RateLimit-Reset'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Cost:
              description: 'Always sent: #/components/headers/X-Tokens-Cost'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Used:
              $ref: '#/components/headers/X-Tokens-Used'
            X-Tokens-Remaining:
              $ref: '#/components/headers/X-Tokens-Remaining'
            X-Tokens-Limit:
              $ref: '#/components/headers/X-Tokens-Limit'
            X-Tokens-Reset:
              $ref: '#/components/headers/X-Tokens-Reset'
            ETag:
              description: 'Always sent: #/components/headers/ETag'
              required: true
              schema:
                type: string
            X-Processed-At:
              description: 'Always sent: #/components/headers/X-Processed-At'
              required: true
              schema:
                type: string
            X-OddsRelay-Request-Id:
              description: 'Always sent: #/components/headers/X-OddsRelay-Request-Id'
              required: true
              schema:
                type: string
            X-Count:
              $ref: '#/components/headers/X-Count'
            X-Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
            X-Feed-Type:
              $ref: '#/components/headers/X-Feed-Type'
            X-Region:
              $ref: '#/components/headers/X-Region'
            Content-Encoding:
              $ref: '#/components/headers/Content-Encoding'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - meta
                  - data
                  properties:
                    meta:
                      $ref: '#/components/schemas/PageMeta'
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Sport'
                - type: array
                  items:
                    $ref: '#/components/schemas/Sport'
              examples:
                page:
                  summary: GET /v2/sports
                  value:
                    meta:
                      feed_type: sports
                      region: uk
                      odds_format: decimal
                      processed_at: '2026-09-17T02:20:11.103Z'
                      count: 250
                      version: v2
                      next_cursor: eyJrIjoiQ3JpY2tldCIsImkiOiJjcmlja2V0X21pbm9yX2xlYWd1ZV8yMDI2IiwidCI6MTc4OTYxMTYzMH0=
                    data:
                    - key: american_football_american_football
                      group: American Football
                      title: American Football
                      description: American Football (American Football)
                      active: true
                      has_outrights: false
                      regions:
                      - uk
                      markets:
                      - h2h
                      - handicap_points
                      - over_under_points
                    - key: american_football_canada_cfl
                      group: American Football
                      title: Canada CFL
                      description: Canada CFL (American Football)
                      active: true
                      has_outrights: false
                      regions:
                      - uk
                      markets:
                      - h2h
                      - handicap_points
                      - odd_even
                      - over_under_points
                  description: Trimmed from a live reply.
        '304':
          description: 'Not modified: no body.'
          headers:
            X-OddsRelay-Api-Version:
              description: 'Always sent: #/components/headers/X-OddsRelay-Api-Version'
              required: true
              schema:
                type: string
            Cache-Control:
              description: 'Always sent: #/components/headers/Cache-Control'
              required: true
              schema:
                type: string
            Vary:
              description: 'Always sent: #/components/headers/Vary'
              required: true
              schema:
                type: string
            X-RateLimit-Limit:
              description: 'Always sent: #/components/headers/X-RateLimit-Limit'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Remaining:
              description: 'Always sent: #/components/headers/X-RateLimit-Remaining'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Reset:
              description: 'Always sent: #/components/headers/X-RateLimit-Reset'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Cost:
              description: 'Always sent: #/components/headers/X-Tokens-Cost'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Used:
              $ref: '#/components/headers/X-Tokens-Used'
            X-Tokens-Remaining:
              $ref: '#/components/headers/X-Tokens-Remaining'
            X-Tokens-Limit:
              $ref: '#/components/headers/X-Tokens-Limit'
            X-Tokens-Reset:
              $ref: '#/components/headers/X-Tokens-Reset'
            ETag:
              description: 'Always sent: #/components/headers/ETag'
              required: true
              schema:
                type: string
            X-Processed-At:
              description: 'Always sent: #/components/headers/X-Processed-At'
              required: true
              schema:
                type: string
            X-Count:
              $ref: '#/components/headers/X-Count'
            X-Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
            X-Feed-Type:
              $ref: '#/components/headers/X-Feed-Type'
            X-Region:
              $ref: '#/components/headers/X-Region'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Unknown or repeated parameter; a bad `format`, `dateFormat` or `cursor`; a region list, repeat or uppercase code.
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`missing_api_key`, `invalid_api_key` (also a closed account), `revoked_api_key`, `expired_api_key`, `paused_api_key`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`account_suspended`, `origin_not_allowed`, `schema_not_in_scope`.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`unknown_region`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_from_address`, then after authentication `too_many_requests`; the front door''s own caps answer an empty-bodied 429.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`temporarily_unavailable`.'
        '502':
          $ref: '#/components/responses/FrontDoorError'
  /v2/events:
    get:
      operationId: listEvents
      summary: Events of a sport
      description: 'The events on the matched boards under one sport key or prefix, with the boards carrying each. Free. Paged 250 at a time in (kick-off, id) order; a cursor resumes strictly after the last event it saw, so an event whose kick-off moves across the cursor during a walk can appear twice or be missed: dedupe by `id` and take a missed event on the next walk. A cursor expires 300 s after it was issued. `region` missing means `uk`.'
