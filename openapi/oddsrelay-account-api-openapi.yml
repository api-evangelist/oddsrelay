openapi: 3.2.0
info:
  title: Oddsrelay Account API
  version: '2026-07-08'
  x-verified: '2026-10-08'
  description: 'Operations tagged Account across 2 of this provider''s published API definitions: oddsrelay-openapi.json, oddsrelay-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.oddsrelay.io
security:
- bearerAuth: []
- apiKeyHeader: []
tags:
- name: Account
  description: Usage and prices. Free.
paths:
  /v2/usage:
    get:
      operationId: getUsage
      summary: Your plan, balance, key, flood cap and scope
      description: Free, flood-capped, and answered for a SUSPENDED account too (it shows the reason). Plain JSON. `scope` and `scope_version` are your account's scope (both null when it has none); `key.products` is your key's products within it.
      tags:
      - Account
      parameters: []
      responses:
        '200':
          description: Usage.
          headers:
            X-OddsRelay-Api-Version:
              description: 'Always sent: #/components/headers/X-OddsRelay-Api-Version'
              required: true
              schema:
                type: string
            Cache-Control:
              description: 'Always sent: #/components/headers/Cache-Control'
              required: true
              schema:
                type: string
            Vary:
              description: 'Always sent: #/components/headers/Vary'
              required: true
              schema:
                type: string
            X-RateLimit-Limit:
              description: 'Always sent: #/components/headers/X-RateLimit-Limit'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Remaining:
              description: 'Always sent: #/components/headers/X-RateLimit-Remaining'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Reset:
              description: 'Always sent: #/components/headers/X-RateLimit-Reset'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Cost:
              description: 'Always sent: #/components/headers/X-Tokens-Cost'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Used:
              $ref: '#/components/headers/X-Tokens-Used'
            X-Tokens-Remaining:
              $ref: '#/components/headers/X-Tokens-Remaining'
            X-Tokens-Limit:
              $ref: '#/components/headers/X-Tokens-Limit'
            X-Tokens-Reset:
              $ref: '#/components/headers/X-Tokens-Reset'
            X-OddsRelay-Request-Id:
              description: 'Always sent: #/components/headers/X-OddsRelay-Request-Id'
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
              examples:
                usage:
                  summary: GET /v2/usage
                  value:
                    plan: free
                    rate_card: 2026-09
                    account:
                      status: active
                      suspension_reason: null
                      test: true
                    tokens:
                      used: 0
                      remaining: unlimited
                      limit: unlimited
                      resets_at: '2026-10-16T21:02:31Z'
                    regions:
                    - uk
                    key:
                      id: key_XXXXXXXXXXXX
                      kind: server
                      products:
                      - standard
                      - 2up
                      - dutching
                      - each-way
                      - extra-place
                      - bog
                      - raw
                      regions:
                      - uk
                      token_cap: null
                      tokens_used: null
                    flood_cap:
                      per_10s: 0
                      per_min: 0
                    scope: null
                    scope_version: null
                  description: A live reply; the key id, token count and flood-cap numbers are placeholders.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Unknown or repeated parameter.
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`missing_api_key`, `invalid_api_key` (also a closed account), `revoked_api_key`, `expired_api_key`, `paused_api_key`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`origin_not_allowed`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_from_address`, then after authentication `too_many_requests`; the front door''s own caps answer an empty-bodied 429.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`temporarily_unavailable`.'
        '502':
          $ref: '#/components/responses/FrontDoorError'
    servers:
    - url: https://api.oddsrelay.io
  /v2/pricing:
    get:
      operationId: getPricing
      summary: The price table
      description: The price table every call is priced from, byte for byte. Free. `ETag` is its SHA-256 (`-gz` on the gzip copy); 304 on a match. Gzip unless refused.
      tags:
      - Account
      parameters: []
      responses:
        '200':
          description: The table.
          headers:
            X-OddsRelay-Api-Version:
              description: 'Always sent: #/components/headers/X-OddsRelay-Api-Version'
              required: true
              schema:
                type: string
            Cache-Control:
              description: 'Always sent: #/components/headers/Cache-Control'
              required: true
              schema:
                type: string
            Vary:
              description: 'Always sent: #/components/headers/Vary'
              required: true
              schema:
                type: string
            X-RateLimit-Limit:
              description: 'Always sent: #/components/headers/X-RateLimit-Limit'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Remaining:
              description: 'Always sent: #/components/headers/X-RateLimit-Remaining'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Reset:
              description: 'Always sent: #/components/headers/X-RateLimit-Reset'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Cost:
              description: 'Always sent: #/components/headers/X-Tokens-Cost'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Used:
              $ref: '#/components/headers/X-Tokens-Used'
            X-Tokens-Remaining:
              $ref: '#/components/headers/X-Tokens-Remaining'
            X-Tokens-Limit:
              $ref: '#/components/headers/X-Tokens-Limit'
            X-Tokens-Reset:
              $ref: '#/components/headers/X-Tokens-Reset'
            ETag:
              description: 'Always sent: #/components/headers/ETag'
              required: true
              schema:
                type: string
            X-OddsRelay-Request-Id:
              description: 'Always sent: #/components/headers/X-OddsRelay-Request-Id'
              required: true
              schema:
                type: string
            Content-Encoding:
              $ref: '#/components/headers/Content-Encoding'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTable'
              examples:
                table:
                  summary: GET /v2/pricing
                  value:
                    rate_card: 2026-09
                    provisional: true
                    captured_at: '2026-09-16T12:01:45Z'
                    recent:
                      max_age_s: 0
                      factor: 0
                    regions:
                      uk:
                        products:
                          standard:
                            whole: 0
                            dims:
                            - sports
                            - bookmakers
                            - exchanges
                            - markets
                            gz_bytes: 0
                        points:
                          standard:
                            sports:
                              soccer: 0
                              tennis: 0
                              _other: 0
                  description: Trimmed from a live reply. Numbers are placeholders.
        '304':
          description: 'Not modified: no body.'
          headers:
            X-OddsRelay-Api-Version:
              description: 'Always sent: #/components/headers/X-OddsRelay-Api-Version'
              required: true
              schema:
                type: string
            Cache-Control:
              description: 'Always sent: #/components/headers/Cache-Control'
              required: true
              schema:
                type: string
            Vary:
              description: 'Always sent: #/components/headers/Vary'
              required: true
              schema:
                type: string
            X-RateLimit-Limit:
              description: 'Always sent: #/components/headers/X-RateLimit-Limit'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Remaining:
              description: 'Always sent: #/components/headers/X-RateLimit-Remaining'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-RateLimit-Reset:
              description: 'Always sent: #/components/headers/X-RateLimit-Reset'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Cost:
              description: 'Always sent: #/components/headers/X-Tokens-Cost'
              required: true
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Tokens-Used:
              $ref: '#/components/headers/X-Tokens-Used'
            X-Tokens-Remaining:
              $ref: '#/components/headers/X-Tokens-Remaining'
            X-Tokens-Limit:
              $ref: '#/components/headers/X-Tokens-Limit'
            X-Tokens-Reset:
              $ref: '#/components/headers/X-Tokens-Reset'
            ETag:
              description: 'Always sent: #/components/headers/ETag'
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Unknown or repeated parameter.
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: '`missing_api_key`, `invalid_api_key` (also a closed account), `revoked_api_key`, `expired_api_key`, `paused_api_key`.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`account_suspended`, `origin_not_allowed`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: '`too_many_from_address`, then after authentication `too_many_requests`; the front door''s own caps answer an empty-bodied 429.'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`internal_error`.'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: '`temporarily_unavailable`.'
        '502':
          $ref: '#/components/responses/FrontDoorError'
    servers:
    - url: https://api.oddsrelay.io
components:
  examples:
    raw_not_enabled:
      summary: Raw board not held
      value:
        error:
          code: raw_not_enabled
          message: The raw feed is not enabled on this deployment.
          request_id: or_req_00000000000000000000000000000000
    too_many_from_address:
      summary: The per-address shield
      value:
        error:
          code: too_many_from_address
          message: Too many requests from this address.
          request_id: or_req_00000000000000000000000000000000
    too_many_requests:
      summary: The account's flood cap
      value:
        error:
          code: too_many_requests
          message: Too many requests for this account.
          request_id: or_req_00000000000000000000000000000000
    not_in_key_scope:
      summary: Product outside the key
      value:
        error:
          code: not_in_key_scope
          message: This key does not include 'raw'.
          request_id: or_req_00000000000000000000000000000000
          type: product
    invalid_api_key:
      summary: Key not recognised
      value:
        error:
          code: invalid_api_key
          message: API key not recognised.
          request_id: or_req_00000000000000000000000000000000
    account_suspended:
      summary: Suspended account
      value:
        error:
          code: account_suspended
          message: This account is suspended because of a payment problem.
          request_id: or_req_00000000000000000000000000000000
          reason: payment
          dashboard_url: https://app.oddsrelay.io/billing
    unknown_sport:
      summary: Unknown sport (valid trimmed)
      value:
        error:
          code: unknown_sport
          message: 'Unknown sport ''curling_xyz''. A sport or a competition key: full list: /v2/sports.'
          request_id: or_req_00000000000000000000000000000000
          valid:
          - american_football
          - aussie_rules
          - badminton
          - baseball
          - basketball
          - boxing
    unknown_bookmaker:
      summary: Unknown bookmaker (valid trimmed)
      value:
        error:
          code: unknown_bookmaker
          message: Unknown bookmaker 'nope'.
          request_id: or_req_00000000000000000000000000000000
          valid:
          - 7bet
          - 888sport
          - bet365
          - bet600
          - bet_target
          - betano
    missing_api_key:
      summary: No key
      value:
        error:
          code: missing_api_key
          message: 'No API key presented. Send Authorization: Bearer or_live_… or x-api-key.'
          request_id: or_req_00000000000000000000000000000000
    paused_api_key:
      summary: Paused key
      value:
        error:
          code: paused_api_key
          message: This API key is paused.
          request_id: or_req_00000000000000000000000000000000
    expired_api_key:
      summary: Expired key
      value:
        error:
          code: expired_api_key
          message: This API key has expired.
          request_id: or_req_00000000000000000000000000000000
    bad_request_cursor:
      summary: Expired cursor
      value:
        error:
          code: bad_request
          message: 'cursor expired: start again from the first page'
          request_id: or_req_00000000000000000000000000000000
    product_not_in_region:
      summary: Product the region does not serve
      value:
        error:
          code: product_not_in_region
          message: Region 'za' does not serve 'standard'.
          request_id: or_req_00000000000000000000000000000000
          type: product
    region_required:
      summary: No region and the key lacks uk
      value:
        error:
          code: region_required
          message: This key does not cover uk, the region a call without ?region= reads. Add ?region=za (one of your key's regions).
          request_id: or_req_00000000000000000000000000000000
    sport_not_in_plan:
      summary: Sport outside the account's scope
      value:
        error:
          code: sport_not_in_plan
          message: '''tennis'' is not in your plan''s sports for standard: ''valid'' lists them. GET /v2/usage shows your account''s scope.'
          request_id: or_req_00000000000000000000000000000000
          valid:
          - horse_racing
          - soccer
    bookmaker_not_in_region:
      summary: Venue outside the region
      value:
        error:
          code: bookmaker_not_in_region
          message: '''william_hill'' is not a venue in region ''za'': GET /v2/bookmakers lists each venue''s regions.'
          request_id: or_req_00000000000000000000000000000000
          type: region
    region_not_in_scope:
      summary: Region outside the key
      value:
        error:
          code: region_not_in_scope
          message: Key not scoped for region 'za'.
          request_id: or_req_00000000000000000000000000000000
          type: region
    bad_request_param:
      summary: Unknown parameter
      value:
        error:
          code: bad_request
          message: 'Unknown parameter ''foo'': /v2/odds/{type} accepts bookmakers, commenceTimeFrom, commenceTimeTo, dateFormat, exchanges, format, markets, oddsFormat, quote, region, sports.'
          request_id: or_req_00000000000000000000000000000000
    unknown_market:
      summary: Unknown market on this product, carried by others (valid trimmed)
      value:
        error:
          code: unknown_market
          message: 'Unknown market ''each_way''. Carried by: /v2/odds/each-way, /v2/odds/extra-place.'
          request_id: or_req_00000000000000000000000000000000
          valid:
          - 1st_half_away_team_total_goals
          - 1st_half_away_team_total_points
          - 1st_half_btts
          - 1st_half_correct_score
          - 1st_half_double_chance
          - 1st_half_handicap_goals
          products:
          - each-way
          - extra-place
    internal_error:
      summary: Internal error
      value:
        error:
          code: internal_error
          message: Internal error.
          request_id: or_req_00000000000000000000000000000000
    exchange_not_in_plan:
      summary: Exchange outside the account's scope
      value:
        error:
          code: exchange_not_in_plan
          message: '''smarkets'' is not in your plan''s exchanges for standard: ''valid'' lists the ones it serves in this region. GET /v2/usage shows your account''s scope.'
          request_id: or_req_00000000000000000000000000000000
          valid:
          - betfair_exchange
    schema_not_in_scope:
      summary: Key pinned to another API version
      value:
        error:
          code: schema_not_in_scope
          message: Key not scoped for the 'v2' API. Use the version your key is scoped to.
          request_id: or_req_00000000000000000000000000000000
          type: schema
    temporarily_unavailable:
      summary: Board or registry not ready
      value:
        error:
          code: temporarily_unavailable
          message: Feed temporarily unavailable.
          request_id: or_req_00000000000000000000000000000000
    unknown_exchange:
      summary: A bookmaker named in exchanges
      value:
        error:
          code: unknown_exchange
          message: 'Unknown exchange ''william_hill''. ''william_hill'' is a bookmaker: use bookmakers=william_hill.'
          request_id: or_req_00000000000000000000000000000000
          valid:
          - betdaq
          - betfair_exchange
          - matchbook
          - smarkets
    revoked_api_key:
      summary: Revoked key
      value:
        error:
          code: revoked_api_key
          message: This API key has been revoked.
          request_id: or_req_00000000000000000000000000000000
    missing_param:
      summary: Required parameter missing
      value:
        error:
          code: missing_param
          message: Required query parameter 'sport' is missing.
          request_id: or_req_00000000000000000000000000000000
    bad_request_gzip:
      summary: Gzip refused on standard, dutching or raw
      value:
        error:
          code: bad_request
          message: 'add Accept-Encoding: gzip; with curl use --compressed'
          request_id: or_req_00000000000000000000000000000000
    bookmaker_not_in_plan:
      summary: Venue outside the plan's bookmakers
      value:
        error:
          code: bookmaker_not_in_plan
          message: '''coral'' is not in your plan''s bookmakers: ''valid'' lists the ones it serves in this region.'
          request_id: or_req_00000000000000000000000000000000
          valid:
          - bet365
          - william_hill
    market_not_in_plan:
      summary: Market outside the account's scope
      value:
        error:
          code: market_not_in_plan
          message: '''double_chance'' is not in your plan''s markets for standard: ''valid'' lists them. GET /v2/usage shows your account''s scope.'
          request_id: or_req_00000000000000000000000000000000
          valid:
          - btts
          - h2h
          - totals
    origin_not_allowed:
      summary: Browser key off its website
      value:
        error:
          code: origin_not_allowed
          message: This key may not be used from this website.
          request_id: or_req_00000000000000000000000000000000
  responses:
    FrontDoorError:
      description: '502 from the front door when the API behind it does not answer: an empty body, no `code`. Retry with backoff.'
    TooManyRequests:
      description: '429 with `Retry-After`. `too_many_requests`: the account''s flood cap or its in-flight cap (with `X-RateLimit-*`). `too_many_from_address`: the per-address shield, before authentication (no token or flood-cap headers). The front door''s own per-address and global caps also answer 429 with `Retry-After`, but with an EMPTY body and no `code`.'
      headers:
        X-OddsRelay-Api-Version:
          description: The API version label, equal to this document's `info.version`. On every reply but `/healthz`, a `HEAD`'s 405 and the empty-bodied 429s and 502.
          required: true
          schema:
            type: string
        X-OddsRelay-Request-Id:
          description: 'This request''s id (`or_req_` + 32 hex), the same value as an error body''s `request_id`: quote it when you contact us. On data and discovery 200s, quotes, `/v2/usage` and `/v2/pricing` 200s and every JSON error but a 405; not on 304s, `/v2/health`, `/v2/regions`, `/v2/coverage` 200s or `/v2/odds/event/{id}` 200s.'
          required: true
          schema:
            type: string
        Vary:
          $ref: '#/components/headers/Vary'
        Retry-After:
          description: 'Seconds to wait before retrying: on every 429 and 503. A 402 never carries it.'
          required: true
          schema:
            type: string
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Tokens-Cost:
          $ref: '#/components/headers/X-Tokens-Cost'
        X-Tokens-Used:
          $ref: '#/components/headers/X-Tokens-Used'
        X-Tokens-Remaining:
          $ref: '#/components/headers/X-Tokens-Remaining'
        X-Tokens-Limit:
          $ref: '#/components/headers/X-Tokens-Limit'
        X-Tokens-Reset:
          $ref: '#/components/headers/X-Tokens-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error429'
          examples:
            too_many_requests:
              $ref: '#/components/examples/too_many_requests'
            too_many_from_address:
              $ref: '#/components/examples/too_many_from_address'
    Unauthorized:
      description: '401: no key, or a key that is not accepted. Carries `WWW-Authenticate`; no token or flood-cap headers.'
      headers:
        X-OddsRelay-Api-Version:
          description: The API version label, equal to this document's `info.version`. On every reply but `/healthz`, a `HEAD`'s 405 and the empty-bodied 429s and 502.
          required: true
          schema:
            type: string
        X-OddsRelay-Request-Id:
          description: 'This request''s id (`or_req_` + 32 hex), the same value as an error body''s `request_id`: quote it when you contact us. On data and discovery 200s, quotes, `/v2/usage` and `/v2/pricing` 200s and every JSON error but a 405; not on 304s, `/v2/health`, `/v2/regions`, `/v2/coverage` 200s or `/v2/odds/event/{id}` 200s.'
          required: true
          schema:
            type: string
        Vary:
          $ref: '#/components/headers/Vary'
        WWW-Authenticate:
          description: On every 401.
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
          examples:
            missing_api_key:
              $ref: '#/components/examples/missing_api_key'
            invalid_api_key:
              $ref: '#/components/examples/invalid_api_key'
            revoked_api_key:
              $ref: '#/components/examples/revoked_api_key'
            expired_api_key:
              $ref: '#/components/examples/expired_api_key'
            paused_api_key:
              $ref: '#/components/examples/paused_api_key'
    ServiceUnavailable:
      description: '503 with `Retry-After`: `temporarily_unavailable` (a board, the key registry or a connection is not ready; retry) or `raw_not_enabled` (the key may use raw but the raw board is not held here).'
      headers:
        X-OddsRelay-Api-Version:
          description: The API version label, equal to this document's `info.version`. On every reply but `/healthz`, a `HEAD`'s 405 and the empty-bodied 429s and 502.
          required: true
          schema:
            type: string
        X-OddsRelay-Request-Id:
          description: 'This request''s id (`or_req_` + 32 hex), the same value as an error body''s `request_id`: quote it when you contact us. On data and discovery 200s, quotes, `/v2/usage` and `/v2/pricing` 200s and every JSON error but a 405; not on 304s, `/v2/health`, `/v2/regions`, `/v2/coverage` 200s or `/v2/odds/event/{id}` 200s.'
          required: true
          schema:
            type: string
        Vary:
          $ref: '#/components/headers/Vary'
        Retry-After:
          description: 'Seconds to wait before retrying: on every 429 and 503. A 402 never carries it.'
          required: true
          schema:
            type: string
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Tokens-Cost:
          $ref: '#/components/headers/X-Tokens-Cost'
        X-Tokens-Used:
          $ref: '#/components/headers/X-Tokens-Used'
        X-Tokens-Remaining:
          $ref: '#/components/headers/X-Tokens-Remaining'
        X-Tokens-Limit:
          $ref: '#/components/headers/X-Tokens-Limit'
        X-Tokens-Reset:
          $ref: '#/components/headers/X-Tokens-Reset'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error503'
          examples:
            temporarily_unavailable:
              $ref: '#/components/examples/temporarily_unavailable'
            raw_not_enabled:
              $ref: '#/components/examples/raw_not_enabled'
    BadRequest:
      description: '400: a parameter this route does not read or sent twice, a malformed value, gzip refused on standard, dutching or raw, or a filter value the catalogue does not know.'
      headers:
        X-OddsRelay-Api-Version:
