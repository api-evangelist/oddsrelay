      description: '502 from the front door when the API behind it does not answer: an empty body, no `code`. Retry with backoff.'
    TooManyRequests:
      description: '429 with `Retry-After`. `too_many_requests`: the account''s flood cap or its in-flight cap (with `X-RateLimit-*`). `too_many_from_address`: the per-address shield, before authentication (no token or flood-cap headers). The front door''s own per-address and global caps also answer 429 with `Retry-After`, but with an EMPTY body and no `code`.'
      headers:
        X-OddsRelay-Api-Version:
          description: The API version label, equal to this document's `info.version`. On every reply but `/healthz`, a `HEAD`'s 405 and the empty-bodied 429s and 502.
          required: true
          schema:
            type: string
        X-OddsRelay-Request-Id:
